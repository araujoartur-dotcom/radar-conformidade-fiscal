name: CI & Build Verification

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Checagem de Tipos TypeScript (tsc)
        run: npx tsc --noEmit

      - name: Build de Produção (Vite)
        run: npm run build

      - name: Verificação de Artefatos Gerados
        run: |
          test -f dist/index.html && echo "✅ dist/index.html gerado com sucesso"
          test -d dist/assets && echo "✅ dist/assets compilado com sucesso"
